<text x="620" y="548" class="note" text-anchor="middle">staging.bureau → dates, junk dimension and bureau fact; agg_bureau_balance adds the DPD status</text>
<text x="620" y="564" class="note" text-anchor="middle">application_calendar places each application in time; bureau dates are offsets from its application date</text>

