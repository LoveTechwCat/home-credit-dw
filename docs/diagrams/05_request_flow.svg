<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 904" width="1240" height="904" role="img" aria-labelledby="dg5-t dg5-d">
<title id="dg5-t">Query flow of one Analytics cube request</title>
<desc id="dg5-d">The analyst changes the Analytics view: a filter chip (slice/dice), the interval, roll-up or drill-down arrows, removing or adding a dimension, or pivot. The React page writes the view to ?state= in the URL and sends five POST /api/analytics/cube requests at once (four panels and the Cube table). FastAPI validates each body with a strict CubeQuery model (422 on a bad body); the cube layer checks the names against the whitelists (400), compiles the conditions to bound parameters and runs one GROUPING SETS query on the read-only DuckDB view mart.v_application_wide. Cells, subtotals and the grand total come back as gzipped JSON and the charts re-render; clicking a cell or bar drills through to the Explorer. Cube queries are not cached; other API reads (Overview, grades, rules, Explorer book) are.</desc>
<style>
.dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--teal:#1baf7a;--teal-soft:#e3f5ee;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){.dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--teal:#199e70;--teal-soft:#11302a}}
:root[data-theme=light] .dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--teal:#1baf7a;--teal-soft:#e3f5ee}
:root[data-theme=dark] .dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--teal:#199e70;--teal-soft:#11302a}
.dg text{fill:var(--ink)}.dg .t3{fill:var(--ink3)}
.dg .canvas{fill:var(--canvas)}
.dg .head{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.dg .heada{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.dg .ti{font-size:15px;font-weight:600}.dg .sub{font-size:11.5px;fill:var(--ink3)}.dg .sm{font-size:11.5px}
.dg .life{stroke:var(--line);stroke-width:1.4;stroke-dasharray:4 5}
.dg .act{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1}
.dg .m{fill:none;stroke:var(--ink2);stroke-width:1.5}.dg .r{fill:none;stroke:var(--ink3);stroke-width:1.4;stroke-dasharray:6 4}
.dg .ah{fill:var(--ink2)}.dg .ahr{fill:var(--ink3)}
.dg .msg{font-size:12.5px;fill:var(--ink)}.dg .code{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:12px;fill:var(--acc-ink)}
.dg .note{font-size:11.5px;fill:var(--ink3)}
.dg .badge{fill:var(--acc)}.dg .bt{fill:#fff;font-size:11px;font-weight:700}
.dg .notebox{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.dg .lb{paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
</style>
<defs>
  <marker id="dg5-m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
  <marker id="dg5-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="var(--ink3)" stroke-width="1.6"/></marker>
</defs>
<rect class="canvas" width="1240" height="904"/>

<!-- lifelines -->
<path class="life" d="M100,78 V860"/>
<path class="life" d="M330,78 V860"/>
<path class="life" d="M570,78 V860"/>
<path class="life" d="M820,78 V860"/>
<path class="life" d="M1110,78 V860"/>

<!-- activation bars -->
<rect class="act" x="324" y="140" width="12" height="710" rx="2"/>
<rect class="act" x="564" y="258" width="12" height="432" rx="2"/>
<rect class="act" x="814" y="384" width="12" height="246" rx="2"/>
<rect class="act" x="1104" y="536" width="12" height="56" rx="2"/>

<!-- heads -->
<rect class="heada" x="20" y="18" width="160" height="60" rx="12"/>
<text x="100" y="44" class="ti" text-anchor="middle">Analyst</text><text x="100" y="62" class="sub" text-anchor="middle">browser user</text>
<rect class="head" x="230" y="18" width="200" height="60" rx="12"/>
<text x="330" y="44" class="ti" text-anchor="middle">React · Analytics</text><text x="330" y="62" class="sub" text-anchor="middle">view state in ?state=</text>
<rect class="head" x="470" y="18" width="200" height="60" rx="12"/>
<text x="570" y="44" class="ti" text-anchor="middle">FastAPI</text><text x="570" y="62" class="sub" text-anchor="middle">POST /api/analytics/cube</text>
<rect class="head" x="720" y="18" width="200" height="60" rx="12"/>
<text x="820" y="44" class="ti" text-anchor="middle">Cube layer</text><text x="820" y="62" class="sub" text-anchor="middle">hcdw/api/cube.py</text>
<rect class="heada" x="1010" y="18" width="200" height="60" rx="12"/>
<text x="1110" y="44" class="ti" text-anchor="middle">DuckDB · read-only</text><text x="1110" y="62" class="sub" text-anchor="middle">mart.v_application_wide</text>

<!-- 1 change the view -->
<circle class="badge" cx="118" cy="110" r="9"/><text x="118" y="114" class="bt" text-anchor="middle">1</text>
<text x="134" y="114" class="msg lb">filter chip (slice/dice)</text>
<text x="134" y="132" class="msg lb">or Interval · ▲ ▼ × + ⇄</text>
<path class="m" d="M100,144 H322" marker-end="url(#dg5-m)"/>

<!-- 2 self: URL state -->
<circle class="badge" cx="348" cy="166" r="9"/><text x="348" y="170" class="bt" text-anchor="middle">2</text>
<path class="m" d="M336,176 H380 V198 H338" marker-end="url(#dg5-m)"/>
<text x="390" y="190" class="msg lb">update ?state= in the URL</text>
<text x="390" y="206" class="note lb">shareable link</text>

<!-- 3 POST (one per panel) -->
<circle class="badge" cx="354" cy="236" r="9"/><text x="354" y="240" class="bt" text-anchor="middle">3</text>
<text x="370" y="250" class="code lb">POST /api/analytics/cube</text>
<path class="m" d="M336,262 H562" marker-end="url(#dg5-m)"/>
<text x="370" y="280" class="note lb">5 requests in parallel</text>
<text x="370" y="295" class="note lb">4 panels + Cube table</text>

<!-- request body (example) -->
<path class="notebox" d="M112,250 H304 L318,264 V350 H112 Z"/>
<path class="notebox" d="M304,250 V264 H318" fill="none"/>
<text x="124" y="270" class="note">e.g. body of step 3</text>
<text x="124" y="290" class="code">conditions: [ … ]</text>
<text x="124" y="306" class="code">rows: [application_month]</text>
<text x="124" y="322" class="code">cols: [decision]</text>
<text x="124" y="338" class="code">measure: n_applications</text>

<!-- 4a self: validate the body -->
<circle class="badge" cx="590" cy="316" r="10"/><text x="590" y="320" class="bt" text-anchor="middle">4a</text>
<path class="m" d="M576,326 H620 V348 H578" marker-end="url(#dg5-m)"/>
<text x="630" y="338" class="msg lb">strict CubeQuery</text>
<text x="630" y="354" class="note lb">bad type or key → 422</text>

<!-- call the cube layer -->
<text x="600" y="380" class="code lb">cube.run(body)</text>
<path class="m" d="M576,388 H812" marker-end="url(#dg5-m)"/>

<!-- 4b self: whitelist -->
<circle class="badge" cx="840" cy="410" r="10"/><text x="840" y="414" class="bt" text-anchor="middle">4b</text>
<path class="m" d="M826,420 H870 V442 H828" marker-end="url(#dg5-m)"/>
<text x="880" y="432" class="msg lb">whitelisted names</text>
<text x="880" y="448" class="note lb">≤ 2 rows · ≤ 1 col · no repeat</text>
<text x="880" y="463" class="note lb">else → 400</text>
<text x="880" y="478" class="note lb">conditions → bound params</text>

<!-- 5 one SQL query -->
<circle class="badge" cx="844" cy="506" r="9"/><text x="844" y="510" class="bt" text-anchor="middle">5</text>
<text x="860" y="514" class="code lb">WHERE application_id IN (cohort)</text>
<text x="860" y="530" class="code lb">GROUP BY GROUPING SETS (…)</text>
<path class="m" d="M826,540 H1102" marker-end="url(#dg5-m)"/>
<path class="r" d="M1104,578 H828" marker-end="url(#dg5-r)"/>
<text x="966" y="570" class="msg lb" text-anchor="middle">rows · 15–60 ms</text>

<!-- 6 result -->
<circle class="badge" cx="802" cy="606" r="9"/><text x="802" y="610" class="bt" text-anchor="middle">6</text>
<text x="686" y="612" class="msg lb" text-anchor="middle">cells, subtotals, grand total</text>
<path class="r" d="M814,622 H578" marker-end="url(#dg5-r)"/>
<text x="686" y="640" class="note lb" text-anchor="middle">null = a total level</text>
<text x="686" y="655" class="note lb" text-anchor="middle">“(missing)” = a real NULL</text>
<path class="r" d="M564,676 H338" marker-end="url(#dg5-r)"/>
<text x="450" y="668" class="msg lb" text-anchor="middle">JSON · gzip</text>

<!-- 7 self: re-render -->
<circle class="badge" cx="348" cy="700" r="9"/><text x="348" y="704" class="bt" text-anchor="middle">7</text>
<path class="m" d="M336,710 H380 V732 H338" marker-end="url(#dg5-m)"/>
<text x="390" y="724" class="msg lb">re-render panels + table</text>
<text x="390" y="740" class="note lb">dimmed while loading</text>

<!-- 8 drill-through -->
<circle class="badge" cx="118" cy="778" r="9"/><text x="118" y="782" class="bt" text-anchor="middle">8</text>
<text x="134" y="782" class="msg lb">click a cell or bar</text>
<path class="m" d="M100,794 H322" marker-end="url(#dg5-m)"/>
<path class="m" d="M336,808 H380 V830 H338" marker-end="url(#dg5-m)"/>
<text x="390" y="822" class="msg lb">drill-through to /explore</text>
<text x="390" y="838" class="note lb">members become conditions</text>

<text x="20" y="886" class="note">Cube queries are not cached (≈ 15–60 ms each). Other API reads (Overview, grades, rules, Explorer book) are lru_cached; the warehouse is a static snapshot until the next ETL.</text>
</svg>
