<text x="28" y="612" class="t3 sm">[external source]</text>
<text x="28" y="636" class="d">8 CSV files</text>
<text x="28" y="654" class="d">2.7 GB</text>

<rect class="ext dash" x="188" y="808" width="200" height="100" rx="12"/>
<text x="204" y="836" class="ti">Simulated dates</text>
<text x="204" y="854" class="tech">[hcdw synth-dates]</text>
<text x="204" y="876" class="t3 sm">data/synthetic/</text>
<text x="204" y="892" class="t3 sm">application_dates.csv</text>

<rect class="ext" x="528" y="808" width="160" height="88" rx="12"/>
<text x="544" y="836" class="ti">MotherDuck</text>
<text x="544" y="854" class="t3 sm">[optional cloud]</text>
<text x="544" y="878" class="d">shared copy</text>

