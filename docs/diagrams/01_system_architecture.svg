<circle class="fa" cx="474" cy="48" r="10"/>
<path class="fa" d="M456,80 a18,16 0 0 1 36,0 z"/>
<text x="505" y="44" class="ti">Risk manager · credit analyst</text>
<text x="505" y="62" class="tech">[Person]</text>
<text x="505" y="86" class="d">Analyses the book, reviews</text>
<text x="505" y="103" class="d">applications, simulates policy</text>

<!-- System boundary -->
<rect class="bound" x="170" y="150" width="1044" height="626" rx="18"/>
<text x="192" y="178" class="ti">Home Credit DW <tspan class="tech">[software system]</tspan></text>

<!-- Edges (drawn under the boxes) -->
<path class="e" d="M608,116 V178" marker-end="url(#dg1-a)"/>
<text x="620" y="141" class="lb">uses · HTTPS</text>
<path class="e" d="M608,304 V362" marker-end="url(#dg1-a)"/>
<text x="620" y="338" class="lb">JSON over HTTP</text>
<path class="e" d="M608,504 V564" marker-end="url(#dg1-a)"/>
<text x="620" y="538" class="lb">read-only SQL</text>
<path class="e" d="M768,420 H836" marker-end="url(#dg1-a)"/>
<text x="802" y="412" class="lb" text-anchor="middle">assess</text>
<text x="802" y="438" class="lb" text-anchor="middle">simulate</text>
<path class="e dash" d="M900,504 C900,580 830,610 770,610" marker-end="url(#dg1-a)"/>
<text x="910" y="548" class="lb">trains on mart</text>
<path class="e dash" d="M1060,504 V644 a6,6 0 0 1 -6,6 H770" marker-end="url(#dg1-a)"/>
<text x="790" y="640" class="lb">hcdw score writes</text>
<text x="790" y="668" class="lb">fact_risk_assessment · fact_rule_hit</text>
<path class="e" d="M152,617 H186" marker-end="url(#dg1-a)"/>
<path class="e" d="M388,640 H446" marker-end="url(#dg1-a)"/>
<text x="417" y="632" class="lb" text-anchor="middle">builds</text>
<path class="e dash" d="M288,806 V736" marker-end="url(#dg1-a)"/>
<text x="300" y="797" class="lb">simulated</text>
<path class="e dash" d="M608,712 V806" marker-end="url(#dg1-a)"/>
<text x="620" y="752" class="lb">hcdw push (optional)</text>

<!-- Web dashboard -->
<rect class="card" x="448" y="180" width="320" height="124" rx="12"/>
<text x="468" y="208" class="ti">Web dashboard</text>
<text x="468" y="226" class="tech">[React · TypeScript · Tailwind · Recharts]</text>
<text x="468" y="250" class="d">Overview · Analytics (OLAP cube)</text>
<text x="468" y="268" class="d">Explorer · Application details</text>
<text x="468" y="286" class="d">Playground · Grades &amp; model</text>

<!-- Web API -->
<rect class="card" x="448" y="364" width="320" height="140" rx="12"/>
<text x="468" y="392" class="ti">Web API</text>
<text x="468" y="410" class="tech">[Python · FastAPI · Uvicorn]</text>
<text x="468" y="434" class="d">KPIs · OLAP cube (GROUPING SETS)</text>
<text x="468" y="452" class="d">Explorer · assessment · grades</text>
<text x="468" y="470" class="d">rules · policy simulate</text>
<text x="468" y="492" class="t3 sm">whitelisted names · bound params</text>

<!-- Decision support -->
<rect class="card" x="838" y="364" width="358" height="140" rx="12"/>
<text x="858" y="392" class="ti">Decision support</text>
<text x="858" y="410" class="tech">[LightGBM · isotonic · rules in settings.yaml]</text>
<text x="858" y="434" class="d">PD → score grade</text>
<text x="858" y="452" class="d">BR-SEG-01, BR-RF-01..05 → rule grade</text>
<text x="858" y="470" class="d">worse of the two → final grade A–E</text>
<text x="858" y="488" class="d">Approve · Manual review · Reject</text>

<!-- Data warehouse (database) -->
<path class="acc" d="M448,580 a160,14 0 0 1 320,0 v116 a160,14 0 0 1 -320,0 z"/>
<ellipse class="acc" cx="608" cy="580" rx="160" ry="14"/>
<text x="468" y="624" class="ti">Data warehouse</text>
<text x="468" y="642" class="tech">[DuckDB · hc.duckdb]</text>
<text x="468" y="666" class="d">staging → dw (star schema) → mart</text>
<text x="468" y="684" class="d">4 facts · 8 dimensions · 50 checks</text>

<!-- ETL -->
<rect class="card" x="188" y="576" width="200" height="158" rx="12"/>
<text x="206" y="604" class="ti">ETL pipeline</text>
<text x="206" y="622" class="tech">[Python · pandas · SQL]</text>
<text x="206" y="646" class="d">extract → clean →</text>
<text x="206" y="664" class="d">aggregate → load →</text>
<text x="206" y="682" class="d">quality gate</text>
<text x="206" y="706" class="d">hcdw etl · ≈ 15 s</text>
<text x="206" y="724" class="t3 sm">≈ 1.5 min with --score</text>

<!-- External systems -->
