<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-labelledby="dg6-t dg6-d">
<title id="dg6-t">Decision support flow (A-E grades)</title>
<desc id="dg6-d">An application is scored by a calibrated LightGBM model whose probability of default maps to a score grade A to E, and checked against segment and business rules whose historical default rates map to a rule grade on the same scale. The final grade is the worse of the two; rules can only downgrade. Each final grade carries a policy (approve, manual review or reject, with a credit limit) and every result is explained with SHAP factors, the violated rules and a one-line summary. Rule thresholds live in configs/settings.yaml; the Playground re-grades the stored results to simulate other PD cut-offs, decisions, caps and rule settings. Rule rates come from historical loans, and the policy applies to every scored application.</desc>
<style>
.dg{--canvas:#fcfcfb;--bg:#ffffff;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--ext:#efeeea;--grn:#0ca30c;--grn-soft:#e6f5e6;--grn-ink:#0b6b0b;--yel:#eda100;--yel-soft:#fdf2d9;--yel-ink:#8a5d00;--red:#d03b3b;--red-soft:#fbe8e8;--red-ink:#a52b2b;--gA:#1e7a3a;--gAt:#ffffff;--gB:#557a12;--gBt:#ffffff;--gC:#946300;--gCt:#ffffff;--gD:#b54708;--gDt:#ffffff;--gE:#b3261e;--gEt:#ffffff;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){.dg{--canvas:#1a1a19;--bg:#232321;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--ext:#2c2c2a;--grn-soft:#132e15;--grn-ink:#6fd36f;--yel-soft:#382c10;--yel-ink:#f5c454;--red-soft:#3a1919;--red-ink:#f08a8a;--gA:#7fd69b;--gAt:#10181c;--gB:#b8d35a;--gBt:#10181c;--gC:#f2c14e;--gCt:#10181c;--gD:#f59e5b;--gDt:#10181c;--gE:#ff8a80;--gEt:#10181c}}
:root[data-theme=light] .dg{--canvas:#fcfcfb;--bg:#ffffff;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--ext:#efeeea;--grn-soft:#e6f5e6;--grn-ink:#0b6b0b;--yel-soft:#fdf2d9;--yel-ink:#8a5d00;--red-soft:#fbe8e8;--red-ink:#a52b2b;--gA:#1e7a3a;--gAt:#ffffff;--gB:#557a12;--gBt:#ffffff;--gC:#946300;--gCt:#ffffff;--gD:#b54708;--gDt:#ffffff;--gE:#b3261e;--gEt:#ffffff}
:root[data-theme=dark] .dg{--canvas:#1a1a19;--bg:#232321;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--ext:#2c2c2a;--grn-soft:#132e15;--grn-ink:#6fd36f;--yel-soft:#382c10;--yel-ink:#f5c454;--red-soft:#3a1919;--red-ink:#f08a8a;--gA:#7fd69b;--gAt:#10181c;--gB:#b8d35a;--gBt:#10181c;--gC:#f2c14e;--gCt:#10181c;--gD:#f59e5b;--gDt:#10181c;--gE:#ff8a80;--gEt:#10181c}
.dg text{fill:var(--ink)}.dg .t3{fill:var(--ink3)}
.dg .canvas{fill:var(--canvas)}
.dg .ti{font-size:15px;font-weight:600}.dg .tech{font-size:12px;fill:var(--acc-ink)}.dg .d{font-size:12.5px;fill:var(--ink2)}.dg .sm{font-size:11.5px}
.dg .card{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.dg .acc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.dg .e{fill:none;stroke:var(--ink3);stroke-width:1.6}.dg .ah{fill:var(--ink3)}
.dg .gs{fill:var(--grn-soft);stroke:var(--grn);stroke-width:1.2}.dg .ys{fill:var(--yel-soft);stroke:var(--yel);stroke-width:1.2}.dg .rs{fill:var(--red-soft);stroke:var(--red);stroke-width:1.2}
.dg .gt{fill:var(--grn-ink);font-size:11px;font-weight:700}.dg .yt{fill:var(--yel-ink);font-size:11px;font-weight:700}.dg .rt{fill:var(--red-ink);font-size:11px;font-weight:700}
.dg .gA{fill:var(--gA)}.dg .gB{fill:var(--gB)}.dg .gC{fill:var(--gC)}.dg .gD{fill:var(--gD)}.dg .gE{fill:var(--gE)}
.dg .gl{font-size:12px;font-weight:700}
.dg .gAt{fill:var(--gAt)}.dg .gBt{fill:var(--gBt)}.dg .gCt{fill:var(--gCt)}.dg .gDt{fill:var(--gDt)}.dg .gEt{fill:var(--gEt)}
.dg .dot{fill:var(--ink3)}
.dg .lb{font-size:12px;fill:var(--ink2);paint-order:stroke;stroke:var(--canvas);stroke-width:5px;stroke-linejoin:round}
</style>
<defs>
  <marker id="dg6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect class="canvas" width="1240" height="620"/>

<!-- Application -->
<rect class="card" x="20" y="180" width="200" height="170" rx="12"/>
<text x="40" y="208" class="ti">Application</text>
<text x="40" y="226" class="tech">[warehouse row;</text>
<text x="40" y="242" class="tech">hand-typed only via API]</text>
<circle class="dot" cx="44" cy="264" r="2.5"/><text x="54" y="268" class="d">income · credit</text>
<circle class="dot" cx="44" cy="286" r="2.5"/><text x="54" y="290" class="d">annuity · goods price</text>
<circle class="dot" cx="44" cy="308" r="2.5"/><text x="54" y="312" class="d">profile · employment</text>
<circle class="dot" cx="44" cy="330" r="2.5"/><text x="54" y="334" class="d">bureau · payments</text>

<path class="e" d="M220,235 C240,235 238,115 258,115" marker-end="url(#dg6-a)"/>
<path class="e" d="M220,295 C240,295 238,345 258,345" marker-end="url(#dg6-a)"/>

<!-- Risk model -> score grade -->
<rect class="card" x="260" y="30" width="300" height="170" rx="12"/>
<text x="280" y="58" class="ti">Risk model → score grade</text>
<text x="280" y="76" class="tech">[LightGBM · isotonic calibration]</text>
<text x="280" y="102" class="d">calibrated PD mapped to A–E</text>
<rect class="gA" x="280" y="114" width="52" height="20" rx="4"/><text x="306" y="128" class="gl gAt" text-anchor="middle">A</text>
<rect class="gB" x="332" y="114" width="52" height="20"/><text x="358" y="128" class="gl gBt" text-anchor="middle">B</text>
<rect class="gC" x="384" y="114" width="52" height="20"/><text x="410" y="128" class="gl gCt" text-anchor="middle">C</text>
<rect class="gD" x="436" y="114" width="52" height="20"/><text x="462" y="128" class="gl gDt" text-anchor="middle">D</text>
<rect class="gE" x="488" y="114" width="52" height="20" rx="4"/><text x="514" y="128" class="gl gEt" text-anchor="middle">E</text>
<text x="332" y="152" class="t3 sm" text-anchor="middle">1%</text>
<text x="384" y="152" class="t3 sm" text-anchor="middle">7%</text>
<text x="436" y="152" class="t3 sm" text-anchor="middle">13%</text>
<text x="488" y="152" class="t3 sm" text-anchor="middle">20%</text>
<text x="280" y="182" class="t3 sm">left-closed: PD of exactly 7% is grade C</text>

<!-- Rules -> rule grade -->
<rect class="card" x="260" y="230" width="300" height="246" rx="12"/>
<text x="280" y="258" class="ti">Rules → rule grade</text>
<text x="280" y="276" class="tech">[configs/settings.yaml · dw.dim_rule]</text>
<text x="280" y="294" class="t3 sm">thresholds (param) in settings.yaml</text>
<circle class="dot" cx="284" cy="320" r="2.5"/><text x="294" y="324" class="d">BR-SEG-01 high-risk segment</text>
<text x="294" y="342" class="t3 sm">segment grade D or E (mart.segment_risk)</text>
<circle class="dot" cx="284" cy="366" r="2.5"/><text x="294" y="370" class="d">BR-RF-01..05 credit behaviour</text>
<text x="294" y="388" class="t3 sm">refusals · late pay · DPD &gt; 90 · overdue</text>
<text x="280" y="418" class="d">violators' default rate → grade</text>
<text x="280" y="446" class="d">rule grade = worst violated rule</text>
<text x="280" y="464" class="t3 sm">no rule violated → no rule grade</text>

<!-- Final grade -->
<path class="e" d="M560,115 C585,115 578,230 598,230" marker-end="url(#dg6-a)"/>
<path class="e" d="M560,345 C585,345 578,280 598,280" marker-end="url(#dg6-a)"/>
<text x="579" y="176" class="lb" text-anchor="middle">score</text>
<text x="579" y="318" class="lb" text-anchor="middle">rule</text>
<rect class="acc" x="600" y="190" width="190" height="130" rx="12"/>
<text x="620" y="218" class="ti">Final grade</text>
<text x="620" y="244" class="d">worse of the two grades</text>
<text x="620" y="264" class="d">rules only downgrade,</text>
<text x="620" y="282" class="d">never upgrade</text>
<text x="620" y="306" class="t3 sm">e.g. score C + rule E → E</text>

<path class="e" d="M790,235 C815,235 812,145 838,145" marker-end="url(#dg6-a)"/>
<path class="e" d="M790,280 C815,280 812,405 838,405" marker-end="url(#dg6-a)"/>

<!-- Policy -->
<rect class="card" x="840" y="30" width="380" height="274" rx="12"/>
<text x="860" y="58" class="ti">Policy per final grade</text>
<text x="860" y="76" class="tech">[dss.policy · dw.dim_risk_grade]</text>
<rect class="gA" x="860" y="92" width="26" height="20" rx="5"/><text x="873" y="106" class="gl gAt" text-anchor="middle">A</text>
<rect class="gs" x="898" y="92" width="120" height="20" rx="10"/><text x="958" y="106" class="gt" text-anchor="middle">Approve</text>
<text x="1032" y="106" class="d">max 8× income</text>
<rect class="gB" x="860" y="122" width="26" height="20" rx="5"/><text x="873" y="136" class="gl gBt" text-anchor="middle">B</text>
<rect class="gs" x="898" y="122" width="120" height="20" rx="10"/><text x="958" y="136" class="gt" text-anchor="middle">Approve</text>
<text x="1032" y="136" class="d">max 6× income</text>
<rect class="gC" x="860" y="152" width="26" height="20" rx="5"/><text x="873" y="166" class="gl gCt" text-anchor="middle">C</text>
<rect class="ys" x="898" y="152" width="120" height="20" rx="10"/><text x="958" y="166" class="yt" text-anchor="middle">Manual review</text>
<text x="1032" y="166" class="d">max 4× income</text>
<rect class="gD" x="860" y="182" width="26" height="20" rx="5"/><text x="873" y="196" class="gl gDt" text-anchor="middle">D</text>
<rect class="ys" x="898" y="182" width="120" height="20" rx="10"/><text x="958" y="196" class="yt" text-anchor="middle">Manual review</text>
<text x="1032" y="196" class="d">max 3× income</text>
<rect class="gE" x="860" y="212" width="26" height="20" rx="5"/><text x="873" y="226" class="gl gEt" text-anchor="middle">E</text>
<rect class="rs" x="898" y="212" width="120" height="20" rx="10"/><text x="958" y="226" class="rt" text-anchor="middle">Reject</text>
<text x="1032" y="226" class="d">no credit</text>
<text x="860" y="252" class="t3 sm">Tuned in the Playground (simulation only):</text>
<text x="860" y="270" class="t3 sm">PD cut-offs, decision and cap per grade,</text>
<text x="860" y="288" class="t3 sm">each rule on/off and its threshold</text>

<!-- Explanation -->
<rect class="card" x="840" y="324" width="380" height="170" rx="12"/>
<text x="860" y="352" class="ti">Explanation</text>
<text x="860" y="370" class="tech">[SHAP · rule hits · summary]</text>
<circle class="dot" cx="864" cy="394" r="2.5"/><text x="874" y="398" class="d">3–5 factors raising and lowering the PD</text>
<circle class="dot" cx="864" cy="420" r="2.5"/><text x="874" y="424" class="d">violated rules with their rate and grade</text>
<circle class="dot" cx="864" cy="446" r="2.5"/><text x="874" y="450" class="d">one-line summary of any downgrade</text>
<text x="874" y="470" class="t3 sm">"Downgraded from C to E by segment rule BR-SEG-01."</text>

<text x="20" y="528" class="d">Historical (train) applications use their out-of-fold PD (no label leakage); new (test) and hand-typed applications use the full model.</text>
<text x="20" y="550" class="d">hcdw score stores the results in dw.fact_risk_assessment and dw.fact_rule_hit.</text>
<text x="20" y="572" class="d">Application details reads the stored result + SHAP. Playground re-grades the stored PD and rule rates (POST /api/policy/simulate).</text>
<text x="20" y="594" class="d">What-if and simulator are API-only. Rule rates come from historical loans; the policy applies to every scored application.</text>
</svg>
