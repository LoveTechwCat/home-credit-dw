<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="0 0 1240 800" width="1240" height="800" role="img" aria-labelledby="dg2-t dg2-d">
<title id="dg2-t">ETL pipeline</title>
<desc id="dg2-d">The eight Kaggle CSV files and the optional simulated application_dates source go through seven steps (extract, clean, aggregate, dimensions, facts, marts, quality gate) that build a side file hc.duckdb.building in about 15 seconds. If all 50 checks pass the file atomically replaces hc.duckdb; if any step fails the side file is deleted and the live warehouse is untouched. A data-quality report is always written. With --score, hcdw train and hcdw score then fill the DSS facts and re-run the DSS checks (about 1.5 minutes in total).</desc>
<style>
.dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--grn:#0ca30c;--grn-soft:#e6f5e6;--red:#d03b3b;--red-soft:#fbe8e8;--ext:#efeeea;font-family:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
@media (prefers-color-scheme:dark){.dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--grn-soft:#132e15;--red-soft:#3a1919;--ext:#2c2c2a}}
:root[data-theme=light] .dg{--canvas:#fcfcfb;--bg:#ffffff;--panel:#f4f4f1;--line:#d6d5ce;--ink:#171716;--ink2:#52514e;--ink3:#8a8882;--acc:#2a78d6;--acc-soft:#eaf2fd;--acc-ink:#1c5cab;--grn-soft:#e6f5e6;--red-soft:#fbe8e8;--ext:#efeeea}
:root[data-theme=dark] .dg{--canvas:#1a1a19;--bg:#232321;--panel:#151514;--line:#3b3b37;--ink:#f0efec;--ink2:#c3c2b7;--ink3:#97958e;--acc:#3987e5;--acc-soft:#15263b;--acc-ink:#8dbaf0;--grn-soft:#132e15;--red-soft:#3a1919;--ext:#2c2c2a}
.dg text{fill:var(--ink)}.dg .t2{fill:var(--ink2)}.dg .t3{fill:var(--ink3)}
.dg .ti{font-size:15px;font-weight:600}.dg .tech{font-size:12px;fill:var(--acc-ink)}.dg .d{font-size:12.5px;fill:var(--ink2)}.dg .sm{font-size:11.5px}
.dg .mono{font-family:"Cascadia Code",Consolas,ui-monospace,monospace;font-size:11px;fill:var(--ink3)}
.dg .canvas{fill:var(--canvas)}.dg .card{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.dg .panel{fill:var(--panel);stroke:var(--line);stroke-width:1.2}
.dg .acc{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}.dg .ext{fill:var(--ext);stroke:var(--line);stroke-width:1.2}
.dg .ok{fill:var(--grn-soft);stroke:var(--grn);stroke-width:1.4}.dg .ko{fill:var(--red-soft);stroke:var(--red);stroke-width:1.4}
.dg .e{fill:none;stroke:var(--ink3);stroke-width:1.6}.dg .ah{fill:var(--ink3)}.dg .dash{stroke-dasharray:6 5}
.dg .badge{fill:var(--acc)}.dg .bt{fill:#fff;font-size:12px;font-weight:700}
.dg .chip{fill:var(--acc-soft)}.dg .ct{font-size:11.5px;font-weight:600;fill:var(--acc-ink)}
.dg .gi{fill:var(--grn)}.dg .ri{fill:var(--red)}
</style>
<defs>
  <marker id="dg2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker>
</defs>
<rect class="canvas" width="1240" height="800"/>

<!-- Sources -->
<rect class="ext" x="36" y="18" width="360" height="56" rx="12"/>
<text x="54" y="42" class="ti">Kaggle CSV · 8 files</text>
<text x="54" y="62" class="d">58.5M rows · 2.7 GB in data/raw · or data/sample</text>
<rect class="ext dash" x="416" y="18" width="360" height="56" rx="12"/>
<text x="434" y="42" class="ti">application_dates.csv · simulated</text>
<text x="434" y="62" class="d">optional · data/synthetic · hcdw synth-dates</text>
<path class="e" d="M110,74 V112" marker-end="url(#dg2-a)"/>
<path class="e dash" d="M586,74 V88 a6,6 0 0 1 -6,6 H176 a6,6 0 0 0 -6,6 V112" marker-end="url(#dg2-a)"/>
<text x="1204" y="44" class="ti" text-anchor="end">hcdw etl --source raw</text>
<text x="1204" y="64" class="d" text-anchor="end">≈ 15 s · ≈ 1.5 min with --score</text>

<!-- Build band -->
<rect class="panel" x="12" y="114" width="1216" height="388" rx="16"/>
<text x="28" y="140" class="t3 sm" font-weight="600" letter-spacing="0.6">EVERY STEP WRITES TO A SIDE FILE: hc.duckdb.building</text>

<!-- step cards: x = 24 + i*172, width 156 -->
<g>
  <rect class="card" x="24" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="46" cy="182" r="12"/><text x="46" y="186" class="bt" text-anchor="middle">1</text>
  <text x="66" y="187" class="ti">Extract</text>
  <text x="38" y="212" class="mono">etl/extract.py</text>
  <text x="38" y="240" class="d">read_csv as text</text>
  <text x="38" y="259" class="d">TRY_CAST to types</text>
  <text x="38" y="278" class="d">declared cols only</text>
  <text x="38" y="297" class="d">8 files → staging</text>
  <text x="38" y="318" class="t3 sm">+ application_dates</text>
  <text x="38" y="334" class="t3 sm">(optional source)</text>
  <rect class="chip" x="38" y="416" width="50" height="22" rx="11"/><text x="63" y="431" class="ct" text-anchor="middle">6.5 s</text>
</g>
<path class="e" d="M180,182 H194" marker-end="url(#dg2-a)"/>
<g>
  <rect class="card" x="196" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="218" cy="182" r="12"/><text x="218" y="186" class="bt" text-anchor="middle">2</text>
  <text x="238" y="187" class="ti">Clean</text>
  <text x="210" y="212" class="mono">etl/clean.py</text>
  <text x="210" y="240" class="d">R1 365243 → NULL</text>
  <text x="210" y="259" class="d">R2 XNA → Unknown</text>
  <text x="210" y="278" class="d">R4 income outliers</text>
  <text x="210" y="297" class="d">R6–R10 bands</text>
  <text x="210" y="316" class="d">and ratios</text>
  <text x="210" y="340" class="t3 sm">pandas · unit-tested</text>
  <rect class="chip" x="210" y="416" width="50" height="22" rx="11"/><text x="235" y="431" class="ct" text-anchor="middle">1.2 s</text>
</g>
<path class="e" d="M352,182 H366" marker-end="url(#dg2-a)"/>
<g>
  <rect class="card" x="368" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="390" cy="182" r="12"/><text x="390" y="186" class="bt" text-anchor="middle">3</text>
  <text x="410" y="187" class="ti">Aggregate</text>
  <text x="382" y="212" class="mono">transform/1x_*.sql</text>
  <text x="382" y="240" class="d">27M monthly rows</text>
  <text x="382" y="259" class="d">→ 1 per credit</text>
  <text x="382" y="278" class="d">→ 1 per applicant</text>
  <text x="382" y="297" class="d">of 6 child tables</text>
  <text x="382" y="322" class="d">+ calendar offsets</text>
  <text x="382" y="338" class="t3 sm">per application</text>
  <rect class="chip" x="382" y="416" width="50" height="22" rx="11"/><text x="407" y="431" class="ct" text-anchor="middle">0.7 s</text>
</g>
<path class="e" d="M524,182 H538" marker-end="url(#dg2-a)"/>
<g>
  <rect class="card" x="540" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="562" cy="182" r="12"/><text x="562" y="186" class="bt" text-anchor="middle">4</text>
  <text x="582" y="187" class="ti">Dimensions</text>
  <text x="554" y="212" class="mono">transform/2x_*.sql</text>
  <text x="554" y="240" class="d">6 dimensions</text>
  <text x="554" y="259" class="d">surrogate keys</text>
  <text x="554" y="278" class="d">mini + junk dims</text>
  <text x="554" y="297" class="d">role-playing time:</text>
  <text x="554" y="314" class="t3 sm">application/outcome</text>
  <text x="554" y="330" class="t3 sm">bureau open/close</text>
  <text x="554" y="354" class="d">+ dim_risk_grade</text>
  <text x="554" y="373" class="d">+ dim_rule</text>
  <text x="554" y="390" class="t3 sm">from settings.yaml</text>
</g>
<path class="e" d="M696,182 H710" marker-end="url(#dg2-a)"/>
<g>
  <rect class="card" x="712" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="734" cy="182" r="12"/><text x="734" y="186" class="bt" text-anchor="middle">5</text>
  <text x="754" y="187" class="ti">Facts</text>
  <text x="726" y="212" class="mono">transform/3x_*.sql</text>
  <text x="726" y="240" class="d">applications 356K</text>
  <text x="726" y="259" class="d">bureau credit 1.7M</text>
  <text x="726" y="278" class="d">key lookups</text>
  <text x="726" y="297" class="d">FKs enforced</text>
  <text x="726" y="322" class="d">+ empty DSS facts</text>
  <text x="726" y="338" class="t3 sm">filled by hcdw score</text>
</g>
<path class="e" d="M868,182 H882" marker-end="url(#dg2-a)"/>
<g>
  <rect class="card" x="884" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="906" cy="182" r="12"/><text x="906" y="186" class="bt" text-anchor="middle">6</text>
  <text x="926" y="187" class="ti">Marts</text>
  <text x="898" y="212" class="mono">marts/*.sql</text>
  <text x="898" y="240" class="d">application wide</text>
  <text x="898" y="259" class="d">bureau credit wide</text>
  <text x="898" y="278" class="d">segment_risk</text>
  <text x="898" y="297" class="d">rule_stats (45_)</text>
  <text x="898" y="316" class="d">KPI views (50_)</text>
  <text x="898" y="340" class="t3 sm">views, no copies</text>
</g>
<!-- shared timing chip for steps 4-6 (one "load" step in the code), below the cards -->
<path class="e" d="M554,458 V464 H1026 V458"/>
<rect class="chip" x="742" y="470" width="96" height="22" rx="11"/><text x="790" y="485" class="ct" text-anchor="middle">load · 5.1 s</text>
<path class="e" d="M1040,182 H1054" marker-end="url(#dg2-a)"/>
<g>
  <rect class="acc" x="1056" y="156" width="156" height="296" rx="12"/>
  <circle class="badge" cx="1078" cy="182" r="12"/><text x="1078" y="186" class="bt" text-anchor="middle">7</text>
  <text x="1098" y="187" class="ti">Quality gate</text>
  <text x="1070" y="212" class="mono">etl/quality.py</text>
  <text x="1070" y="240" class="d">PK unique</text>
  <text x="1070" y="259" class="d">no orphan FKs</text>
  <text x="1070" y="278" class="d">row completeness</text>
  <text x="1070" y="297" class="d">sum reconciliation</text>
  <text x="1070" y="316" class="d">date checks</text>
  <text x="1070" y="335" class="d">DSS consistency</text>
  <text x="1070" y="360" class="t3 sm">50 / 50 passed</text>
  <rect class="chip" x="1070" y="416" width="50" height="22" rx="11"/><text x="1095" y="431" class="ct" text-anchor="middle">0.2 s</text>
</g>

<!-- Outcomes (shifted below the taller build band) -->
<g transform="translate(0,28)">
<path class="e" d="M186,474 V514" marker-end="url(#dg2-a)"/>
<path class="e" d="M610,474 V514" marker-end="url(#dg2-a)"/>
<path class="e" d="M1029,474 V514" marker-end="url(#dg2-a)"/>
<text x="198" y="498" class="t3 sm">always</text>
<text x="622" y="498" class="t3 sm">any step fails</text>
<text x="1041" y="498" class="t3 sm">all checks pass</text>

<rect class="card" x="36" y="516" width="330" height="104" rx="12"/>
<text x="56" y="544" class="ti">Data-quality report</text>
<text x="56" y="562" class="mono">data/warehouse/dq_report.json</text>
<text x="56" y="586" class="d">row counts · step timings · every check</text>
<text x="56" y="604" class="d">with its detail, for the report chapter</text>

<rect class="ko" x="420" y="516" width="380" height="104" rx="12"/>
<circle class="ri" cx="448" cy="544" r="11"/><path d="M443,539 L453,549 M453,539 L443,549" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
<text x="468" y="549" class="ti">Rolled back</text>
<text x="440" y="580" class="d">hc.duckdb.building is deleted</text>
<text x="440" y="598" class="d">the live warehouse stays exactly as it was</text>

<rect class="ok" x="854" y="516" width="350" height="104" rx="12"/>
<circle class="gi" cx="882" cy="544" r="11"/><path d="M876,544 L880.5,548.5 L888,540" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="902" y="549" class="ti">Atomic swap</text>
<text x="874" y="580" class="d">hc.duckdb.building → hc.duckdb</text>
<text x="874" y="598" class="d">API and dashboard read the new snapshot</text>

<!-- Optional scoring -->
<path class="e dash" d="M1029,620 V664" marker-end="url(#dg2-a)"/>
<text x="1041" y="646" class="t3 sm">optional</text>
<rect class="card dash" x="854" y="666" width="350" height="86" rx="12"/>
<text x="874" y="694" class="ti">hcdw etl --score</text>
<text x="874" y="716" class="d">then hcdw train → hcdw score</text>
<text x="874" y="736" class="t3 sm">fills the DSS facts; DSS checks re-run</text>
</g>
</svg>
